name: Release beta full package

on:
  push:
    tags:
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的 Beta 版本，例如 5.3.0-beta.6"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miuread-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_CHANNEL: beta
      CHANNEL_TAG: beta-channel
      MANIFEST_NAME: update-beta.json

    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta
          fetch-depth: 0

      - name: Resolve beta release identity
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_SHA="$(git rev-parse HEAD)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            RELEASE_TAG="v$VERSION"
            EVENT_SHA="$BRANCH_SHA"
          else
            test "${GITHUB_REF_TYPE:-}" = "tag"
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${RELEASE_TAG#v}"
            EVENT_SHA="$GITHUB_SHA"

            # Tag push 必须来自 beta 当前 HEAD。
            # 这里直接使用 GitHub 事件携带的 GITHUB_SHA，
            # 不再重新 fetch/rev-parse 刚创建的 tag，避免 tag 可见性竞态。
            if [ "$EVENT_SHA" != "$BRANCH_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG 必须创建在 beta 分支最新提交上。"
              echo "::error::beta=$BRANCH_SHA, event_source=$EVENT_SHA"
              exit 1
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::无效的 Beta 版本：$VERSION"
            echo "::error::正确格式示例：5.3.0-beta.6"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=$BRANCH_SHA" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=miuread-v$VERSION-full.zip" >> "$GITHUB_ENV"

          echo "Beta release:"
          echo "  version=$VERSION"
          echo "  tag=$RELEASE_TAG"
          echo "  source=$BRANCH_SHA"

      - name: Read and validate beta identity
        shell: bash
        run: |
          set -euo pipefail

          test -d miuread.koplugin
          test -f miuread.koplugin/main.lua
          test -f miuread.koplugin/_meta.lua
          test -f miuread.koplugin/miuread/config.lua
          test -s CHANGELOG.md
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES
          test -s miuread.koplugin/LICENSE
          test -s miuread.koplugin/NOTICE
          test -s miuread.koplugin/THIRD_PARTY_NOTICES
          grep -Fq 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -Fq '许可证：AGPL-3.0-only。' miuread.koplugin/main.lua

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]

          if tag != "v" + version:
              print(f"::error::版本与 tag 不一致：version={version}, tag={tag}")
              sys.exit(1)

          config = Path("miuread.koplugin/miuread/config.lua").read_text(encoding="utf-8")
          meta = Path("miuread.koplugin/_meta.lua").read_text(encoding="utf-8")
          version_pattern = r"[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+"

          config_version = re.search(
              r'\bVERSION\s*=\s*["\'](' + version_pattern + r')["\']', config
          )
          meta_version = re.search(
              r'\bversion\s*=\s*["\'](' + version_pattern + r')["\']', meta
          )

          if not config_version or not meta_version:
              print("::error::无法读取 config.lua 或 _meta.lua 的 Beta 版本号。")
              sys.exit(1)

          if config_version.group(1) != version or meta_version.group(1) != version:
              print(
                  "::error::发布前源码版本必须已经与目标版本一致："
                  f"target={version}, config={config_version.group(1)}, meta={meta_version.group(1)}"
              )
              print("::error::请先提交正确的 _meta.lua、config.lua 和 CHANGELOG.md，再运行 Release。")
              sys.exit(1)

          channel = re.search(r'\bUPDATE_CHANNEL\s*=\s*["\']([^"\']+)["\']', config)
          label = re.search(r'\bUPDATE_CHANNEL_LABEL\s*=\s*["\']([^"\']+)["\']', config)
          if not channel or channel.group(1) != "beta":
              print("::error::插件不是内测通道。")
              sys.exit(1)
          if not label or label.group(1) != "内测通道":
              print("::error::内测通道名称配置错误。")
              sys.exit(1)

          expected_manifest = (
              "https://github.com/miumiupy98-art/miuread-koreader/"
              "releases/download/beta-channel/update-beta.json"
          )
          manifest = re.search(r'\bUPDATE_MANIFEST\s*=\s*["\']([^"\']+)["\']', config)
          if not manifest or manifest.group(1) != expected_manifest:
              print("::error::内测更新清单主地址配置错误。")
              sys.exit(1)

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = changelog.splitlines()
          start = None
          end = len(lines)
          heading = f"## {version}"

          for index, line in enumerate(lines):
              if line == heading or line.startswith(heading + " - "):
                  start = index + 1
                  break

          if start is None:
              print(f"::error::CHANGELOG.md 缺少 {version}。")
              sys.exit(1)

          for index in range(start, len(lines)):
              if lines[index].startswith("## "):
                  end = index
                  break

          body = "\n".join(lines[start:end]).strip()
          if not body:
              print(f"::error::CHANGELOG.md 中 {version} 没有更新内容。")
              sys.exit(1)

          bullets = []
          for line in lines[start:end]:
              text = line.strip()
              if text.startswith("- "):
                  text = text[2:].strip()
                  if text:
                      bullets.append(text)

          if not bullets:
              print(f"::error::CHANGELOG.md 中 {version} 至少需要一条列表项。")
              sys.exit(1)

          summary_lines = []
          remaining = 180
          for text in bullets[:4]:
              if remaining <= 0:
                  break
              separator = 1 if summary_lines else 0
              available = remaining - separator
              if available <= 0:
                  break
              if len(text) > available:
                  if available >= 4:
                      text = text[: available - 3].rstrip() + "..."
                  else:
                      text = text[:available]
              summary_lines.append(text)
              remaining -= len(text) + separator

          summary = "\n".join(summary_lines).strip()
          if not summary:
              print("::error::无法生成设备更新摘要。")
              sys.exit(1)

          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          Path("update-summary.txt").write_text(summary + "\n", encoding="utf-8")
          PY

          if find miuread.koplugin -type f \( \
              -iname '*.md' -o \
              -iname '*.epub' -o \
              -iname '*.log' -o \
              -name '.DS_Store' -o \
              -name 'miuread.lua' -o \
              -name 'settings.reader.lua' \
          \) | grep -q .; then
            echo "::error::插件目录包含不应发布的文件。"
            exit 1
          fi

      - name: Ensure release tag
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_SHA="$(git rev-parse HEAD)"
          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/$RELEASE_TAG" \
              | awk 'NR==1 {print $1}'
          )"

          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$BRANCH_SHA" ]; then
              echo "::error::$RELEASE_TAG 已存在，但没有指向 beta 当前 HEAD。"
              echo "::error::tag=$REMOTE_TAG_SHA, beta=$BRANCH_SHA"
              echo "::error::请删除错误 tag，或使用新的版本号。"
              exit 1
            fi
            echo "$RELEASE_TAG 已存在且位置正确，继续发布。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$BRANCH_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "已创建 $RELEASE_TAG -> $BRANCH_SHA"
          fi

      - name: Run Lua syntax checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find miuread.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build beta full package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          package_name = os.environ["PACKAGE_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          root = Path("miuread.koplugin")
          output = Path("dist") / package_name
          fixed_time = (2020, 1, 1, 0, 0, 0)

          excluded_names = {
              ".DS_Store",
              "miuread.lua",
              "settings.reader.lua",
              "NON_COMMERCIAL_NOTICE.txt",
          }
          excluded_suffixes = {".md", ".epub", ".log"}

          def excluded(path):
              return (
                  "__MACOSX" in path.parts
                  or path.name in excluded_names
                  or path.suffix.lower() in excluded_suffixes
              )

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              directories = [root] + sorted(
                  [path for path in root.rglob("*") if path.is_dir()],
                  key=lambda path: path.as_posix(),
              )
              for path in directories:
                  info = ZipInfo(path.as_posix().rstrip("/") + "/", fixed_time)
                  info.create_system = 3
                  info.external_attr = (0o40755 << 16) | 0x10
                  archive.writestr(info, b"")

              files = sorted(
                  [path for path in root.rglob("*") if path.is_file() and not excluded(path)],
                  key=lambda path: path.as_posix(),
              )
              for path in files:
                  info = ZipInfo(path.as_posix(), fixed_time)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())

          payload = output.read_bytes()
          official = (
              f"https://github.com/{repo}/releases/download/"
              f"v{version}/{package_name}"
          )
          summary = Path("update-summary.txt").read_text(encoding="utf-8").strip()

          manifest = {
              "version": version,
              "name": f"觅阅 · 微信读书助手 {version} 内测版",
              "channel": "beta",
              "package_type": "full",
              "package_url": official,
              "package_urls": [
                  official,
                  f"https://ghfast.top/{official}",
                  f"https://gh-proxy.com/{official}",
                  f"https://ghproxy.net/{official}",
              ],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
              "summary": summary,
              "notes": summary,
          }

          Path("dist/update-beta.json").write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify beta package and manifest
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "dist/$PACKAGE_NAME"

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import os
          import sys

          package = Path("dist") / os.environ["PACKAGE_NAME"]
          manifest = json.loads(Path("dist/update-beta.json").read_text(encoding="utf-8"))
          summary = Path("update-summary.txt").read_text(encoding="utf-8").strip()

          required = {
              "miuread.koplugin/_meta.lua",
              "miuread.koplugin/main.lua",
              "miuread.koplugin/miuread/config.lua",
              "miuread.koplugin/LICENSE",
              "miuread.koplugin/NOTICE",
              "miuread.koplugin/THIRD_PARTY_NOTICES",
          }
          forbidden_names = {".DS_Store", "miuread.lua", "settings.reader.lua"}
          forbidden_suffixes = {".md", ".epub", ".log"}

          with ZipFile(package) as archive:
              names = archive.namelist()
              damaged = archive.testzip()

          errors = []
          if damaged:
              errors.append(f"ZIP 损坏：{damaged}")

          for name in sorted(required.difference(names)):
              errors.append(f"安装包缺少：{name}")

          for name in names:
              path = Path(name)
              if not name.startswith("miuread.koplugin/"):
                  errors.append(f"安装包根目录错误：{name}")
              if (
                  path.name in forbidden_names
                  or path.suffix.lower() in forbidden_suffixes
                  or "__MACOSX" in path.parts
              ):
                  errors.append(f"不应进入安装包：{name}")

          if manifest.get("version") != os.environ["VERSION"]:
              errors.append("更新清单版本错误")
          if manifest.get("channel") != "beta":
              errors.append("更新清单通道错误")
          if manifest.get("notes") != summary or manifest.get("summary") != summary:
              errors.append("线上更新摘要错误")
          if len(summary.splitlines()) > 4 or len(summary) > 180:
              errors.append("设备更新摘要超过 4 行或 180 个字符")
          if manifest.get("size") != package.stat().st_size:
              errors.append("更新清单文件大小错误")
          if manifest.get("sha256") != hashlib.sha256(package.read_bytes()).hexdigest():
              errors.append("更新清单 SHA-256 错误")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print(f"内测版安装包检查通过，共 {len(names)} 个条目。")
          PY

      - name: Create or update beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILE="dist/$PACKAGE_NAME"
          NOTES_FILE="release-notes.md"

          retry_gh() {
            local attempt=1
            local max_attempts=4
            local delay=2
            local output
            local rc

            while true; do
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e

              if [ "$rc" -eq 0 ]; then
                [ -z "$output" ] || printf '%s\n' "$output"
                return 0
              fi

              [ -z "$output" ] || printf '%s\n' "$output" >&2

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::GitHub API 连续失败 ${max_attempts} 次：$*" >&2
                return "$rc"
              fi

              echo "::warning::GitHub API 请求失败（第 ${attempt}/${max_attempts} 次），${delay} 秒后重试：$*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            retry_gh gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          fi

          retry_gh gh release edit "$RELEASE_TAG" \
            --title "觅阅 · 微信读书助手 $VERSION 内测版" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --latest=false

          retry_gh gh release upload "$RELEASE_TAG" "$FILE" --clobber

          COUNT="$(
            retry_gh gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '[.assets[] | select(.name == env.PACKAGE_NAME)] | length'
          )"

          if [ "$COUNT" != "1" ]; then
            echo "::error::Release 中应有且只有一个 $PACKAGE_NAME。"
            exit 1
          fi

      - name: Quick-check public download URL
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("dist/update-beta.json"))["sha256"])')"

          success=0
          for attempt in 1 2 3; do
            rm -f dist/public-download.zip
            if curl --fail --location --silent --show-error \
                --connect-timeout 5 --max-time 20 \
                --output dist/public-download.zip "$URL"; then
              ACTUAL="$(sha256sum dist/public-download.zip | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                success=1
                break
              fi
            fi
            [ "$attempt" = "3" ] || sleep 2
          done

          if [ "$success" != "1" ]; then
            echo "::warning::Release 已由 GitHub API 确认上传，但当前 runner 暂时无法从公开 CDN 回读；继续发布 Beta 清单。"
          fi

      - name: Publish fixed beta channel manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHANNEL_NOTES="Machine-readable update manifest for MiuRead Beta. Do not install this release directly."

          retry_gh() {
            local attempt=1
            local max_attempts=4
            local delay=2
            local output
            local rc

            while true; do
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e

              if [ "$rc" -eq 0 ]; then
                [ -z "$output" ] || printf '%s\n' "$output"
                return 0
              fi

              [ -z "$output" ] || printf '%s\n' "$output" >&2

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::GitHub API 连续失败 ${max_attempts} 次：$*" >&2
                return "$rc"
              fi

              echo "::warning::GitHub API 请求失败（第 ${attempt}/${max_attempts} 次），${delay} 秒后重试：$*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            retry_gh gh release create "$CHANNEL_TAG" \
              --target "$RELEASE_SOURCE_SHA" \
              --title "MiuRead Beta Update Channel" \
              --notes "$CHANNEL_NOTES" \
              --prerelease \
              --latest=false
          fi

          retry_gh gh release edit "$CHANNEL_TAG" \
            --title "MiuRead Beta Update Channel" \
            --notes "$CHANNEL_NOTES" \
            --prerelease \
            --latest=false

          retry_gh gh release upload "$CHANNEL_TAG" "dist/$MANIFEST_NAME" --clobber

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/$MANIFEST_NAME"
          success=0

          for attempt in 1 2 3; do
            rm -f dist/public-manifest.json
            if curl --fail --location --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output dist/public-manifest.json "$URL" && \
                cmp -s "dist/$MANIFEST_NAME" dist/public-manifest.json; then
              success=1
              break
            fi
            [ "$attempt" = "3" ] || sleep 2
          done

          if [ "$success" != "1" ]; then
            echo "::warning::Beta 清单已由 GitHub API 上传，但当前 runner 暂时无法从公开 CDN 回读。"
          fi
