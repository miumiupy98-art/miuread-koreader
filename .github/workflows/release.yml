name: Release stable full package

# Both manual and Tag builds only generate Stable metadata in the runner.
# Never commit release metadata to main or synchronize main into beta.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的正式版本，例如 5.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miuread-stable-release
  cancel-in-progress: false

jobs:
  release-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_CHANNEL: stable
      CHANNEL_TAG: stable-channel
      MANIFEST_NAME: update.json

    steps:
      - name: Check out source for this release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Resolve and synchronize stable release identity
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_SHA="$(git rev-parse HEAD)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            RELEASE_TAG="v$VERSION"
            EVENT_SHA="$BRANCH_SHA"
          else
            test "${GITHUB_REF_TYPE:-}" = "tag"
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${RELEASE_TAG#v}"
            EVENT_SHA="$GITHUB_SHA"

            # Immutable Tag release: checkout above selected THIS tag, not main.
            # Old Tags may be valid even after main has received later commits.
            if [ "$EVENT_SHA" != "$BRANCH_SHA" ]; then
              echo "::error::检出的 Tag 源码不匹配触发事件：$RELEASE_TAG"
              exit 1
            fi
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::正式 Tag 必须指向 main 分支历史中的提交。"
              exit 1
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效的正式版本：$VERSION"
            echo "::error::正确格式示例：5.3.0"
            exit 1
          fi

          git fetch --force --tags origin

          # Both manual and Tag releases generate version, Stable channel and
          # release notes in this temporary workspace only. Never push these
          # generated files back to main or beta.
          python3 .github/scripts/sync_release_identity.py \
            --channel stable \
            --version "$VERSION" \
            --tag "$RELEASE_TAG"

          RELEASE_SOURCE_SHA="$(git rev-parse HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=$RELEASE_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=miuread-v$VERSION-full.zip" >> "$GITHUB_ENV"

          echo "Stable release:"
          echo "  version=$VERSION"
          echo "  tag=$RELEASE_TAG"
          echo "  source=$RELEASE_SOURCE_SHA"

      - name: Read and validate stable identity
        shell: bash
        run: |
          set -euo pipefail

          test -d miuread.koplugin
          test -f miuread.koplugin/main.lua
          test -f miuread.koplugin/_meta.lua
          test -f miuread.koplugin/miuread/config.lua
          test -s CHANGELOG.md
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES
          test -s miuread.koplugin/LICENSE
          test -s miuread.koplugin/NOTICE
          test -s miuread.koplugin/THIRD_PARTY_NOTICES
          grep -Fq 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -Fq '许可证：AGPL-3.0-only。' miuread.koplugin/main.lua

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if not match or match.group(1) != version:
              print(f"::error::正式版本与 tag 不一致：version={version}, tag={tag}")
              sys.exit(1)

          config = Path("miuread.koplugin/miuread/config.lua").read_text(encoding="utf-8")
          meta = Path("miuread.koplugin/_meta.lua").read_text(encoding="utf-8")
          version_pattern = r"[0-9]+\.[0-9]+\.[0-9]+"
          config_version = re.search(
              r'\bVERSION\s*=\s*["\'](' + version_pattern + r')["\']', config
          )
          meta_version = re.search(
              r'\bversion\s*=\s*["\'](' + version_pattern + r')["\']', meta
          )
          if not config_version or not meta_version:
              print("::error::无法读取 config.lua 或 _meta.lua 的正式版本号。")
              sys.exit(1)
          if config_version.group(1) != version or meta_version.group(1) != version:
              print(
                  "::error::tag、config.lua 与 _meta.lua 版本不一致："
                  f"tag={version}, config={config_version.group(1)}, meta={meta_version.group(1)}"
              )
              sys.exit(1)

          channel = re.search(r'\bUPDATE_CHANNEL\s*=\s*["\']([^"\']+)["\']', config)
          label = re.search(r'\bUPDATE_CHANNEL_LABEL\s*=\s*["\']([^"\']+)["\']', config)
          if not channel or channel.group(1) != "stable":
              print("::error::插件不是正式通道。")
              sys.exit(1)
          if not label or label.group(1) != "正式通道":
              print("::error::正式通道名称配置错误。")
              sys.exit(1)

          expected_manifest = (
              "https://github.com/miumiupy98-art/miuread-koreader/"
              "releases/download/stable-channel/update.json"
          )
          manifest = re.search(r'\bUPDATE_MANIFEST\s*=\s*["\']([^"\']+)["\']', config)
          if not manifest or manifest.group(1) != expected_manifest:
              print("::error::正式更新清单主地址配置错误。")
              sys.exit(1)

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = changelog.splitlines()
          start = None
          end = len(lines)
          heading = f"## {version}"
          for index, line in enumerate(lines):
              if line == heading or line.startswith(heading + " - "):
                  start = index + 1
                  break
          if start is None:
              print(f"::error::CHANGELOG.md 缺少 {version}。")
              sys.exit(1)
          for index in range(start, len(lines)):
              if lines[index].startswith("## "):
                  end = index
                  break
          body = "\n".join(lines[start:end]).strip()
          if not body:
              print(f"::error::CHANGELOG.md 中 {version} 没有更新内容。")
              sys.exit(1)

          bullets = []
          for line in lines[start:end]:
              text = line.strip()
              if text.startswith("- "):
                  text = text[2:].strip()
                  if text:
                      bullets.append(text)
          if not bullets:
              print(f"::error::CHANGELOG.md 中 {version} 至少需要一条列表项。")
              sys.exit(1)

          summary_lines = []
          remaining = 180
          for text in bullets[:4]:
              if remaining <= 0:
                  break
              separator = 1 if summary_lines else 0
              available = remaining - separator
              if available <= 0:
                  break
              if len(text) > available:
                  if available >= 4:
                      text = text[: available - 3].rstrip() + "..."
                  else:
                      text = text[:available]
              summary_lines.append(text)
              remaining -= len(text) + separator
          summary = "\n".join(summary_lines).strip()
          if not summary:
              print("::error::无法生成设备更新摘要。")
              sys.exit(1)

          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          Path("update-summary.txt").write_text(summary + "\n", encoding="utf-8")
          Path("release.env").write_text(
              f"VERSION={version}\n"
              f"RELEASE_TAG={tag}\n"
              f"PACKAGE_NAME=miuread-v{version}-full.zip\n",
              encoding="utf-8",
          )
          PY

          cat release.env >> "$GITHUB_ENV"

          if find miuread.koplugin -type f \( \
              -iname '*.md' -o \
              -iname '*.epub' -o \
              -iname '*.log' -o \
              -name '.DS_Store' -o \
              -name 'miuread.lua' -o \
              -name 'settings.reader.lua' \
          \) | grep -q .; then
            echo "::error::插件目录包含不应发布的文件。"
            exit 1
          fi

      - name: Build stable full package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          package_name = os.environ["PACKAGE_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          root = Path("miuread.koplugin")
          output = Path("dist") / package_name
          fixed_time = (2020, 1, 1, 0, 0, 0)

          excluded_names = {
              ".DS_Store",
              "miuread.lua",
              "settings.reader.lua",
              "NON_COMMERCIAL_NOTICE.txt",
          }
          excluded_suffixes = {".md", ".epub", ".log"}

          def excluded(path):
              return (
                  "__MACOSX" in path.parts
                  or path.name in excluded_names
                  or path.suffix.lower() in excluded_suffixes
              )

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              directories = [root] + sorted(
                  [path for path in root.rglob("*") if path.is_dir()],
                  key=lambda path: path.as_posix(),
              )
              for path in directories:
                  info = ZipInfo(path.as_posix().rstrip("/") + "/", fixed_time)
                  info.create_system = 3
                  info.external_attr = (0o40755 << 16) | 0x10
                  archive.writestr(info, b"")

              files = sorted(
                  [path for path in root.rglob("*") if path.is_file() and not excluded(path)],
                  key=lambda path: path.as_posix(),
              )
              for path in files:
                  info = ZipInfo(path.as_posix(), fixed_time)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())

          payload = output.read_bytes()
          official = (
              f"https://github.com/{repo}/releases/download/"
              f"v{version}/{package_name}"
          )
          summary = Path("update-summary.txt").read_text(encoding="utf-8").strip()
          manifest = {
              "version": version,
              "name": f"觅阅 · 微信读书助手 {version}",
              "channel": "stable",
              "package_type": "full",
              "package_url": official,
              "package_urls": [
                  official,
                  f"https://ghfast.top/{official}",
                  f"https://gh-proxy.com/{official}",
                  f"https://ghproxy.net/{official}",
              ],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
              "summary": summary,
              "notes": summary,
          }
          Path("dist/update.json").write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Ensure immutable release tag (without updating main)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Refuse to release stale source if main moved while we built.
            git fetch origin main --quiet
            REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
            if [ "$SOURCE_SHA" != "$REMOTE_MAIN_SHA" ]; then
              echo "::error::main 在打包期间发生变化，请从最新 main 重新发布。"
              exit 1
            fi
          fi

          # A version Tag records the source commit. The package is produced
          # from the same source with generated channel/version metadata.
          TAG_SHA="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ]; then
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::$RELEASE_TAG 已指向另一个提交，不移动已有 Tag；请使用新版本号。"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            echo "::error::Tag 触发任务无法找到 Tag：$RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Create or update stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILE="dist/$PACKAGE_NAME"
          NOTES_FILE="release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "觅阅 · 微信读书助手 $VERSION" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "觅阅 · 微信读书助手 $VERSION" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

          gh release upload "$RELEASE_TAG" "$FILE" --clobber

          COUNT="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select(.name == env.PACKAGE_NAME)] | length')"
          if [ "$COUNT" != "1" ]; then
            echo "::error::Release 中应有且只有一个 $PACKAGE_NAME。"
            exit 1
          fi

      - name: Publish fixed stable channel manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NOTES="Machine-readable update manifest for MiuRead Stable. Do not install this release directly."
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release edit "$CHANNEL_TAG" \
              --title "MiuRead Stable Update Channel" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release create "$CHANNEL_TAG" \
              --target "$RELEASE_SOURCE_SHA" \
              --title "MiuRead Stable Update Channel" \
              --notes "$NOTES" \
              --latest=false
          fi

          gh release upload "$CHANNEL_TAG" "dist/$MANIFEST_NAME" --clobber

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNEL_TAG/$MANIFEST_NAME"
          success=0
          for attempt in 1 2 3; do
            rm -f dist/public-manifest.json
            if curl --fail --location --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output dist/public-manifest.json "$URL" && \
                cmp -s "dist/$MANIFEST_NAME" dist/public-manifest.json; then
              success=1
              break
            fi
            [ "$attempt" = "3" ] || sleep 2
          done
          if [ "$success" != "1" ]; then
            echo "::warning::正式清单已由 GitHub API 上传，但当前 runner 暂时无法从公开 CDN 回读。"
          fi

