name: Release preflight (no tag, no publish)

on:
  workflow_dispatch:
  push:
    branches:
      - beta
      - main
    paths:
      - "miuread.koplugin/**"
      - "tools/**"
      - ".github/workflows/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Validate release branch
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            beta) echo "RELEASE_CHANNEL=beta" >> "$GITHUB_ENV" ;;
            main) echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV" ;;
            *) echo "::error::Use beta or main branch for preflight"; exit 1 ;;
          esac
      - name: Install Lua 5.1 and LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit
      - name: Syntax and release regressions
        run: |
          set -euo pipefail
          find miuread.koplugin -name '*.lua' -type f -print0 | xargs -0 -n1 luac5.1 -p
          bash tools/release_preflight.sh "$RELEASE_CHANNEL"
      - name: Full Beta Lua release suite
        if: env.RELEASE_CHANNEL == 'beta'
        env:
          LUA_PATH: "./miuread.koplugin/?.lua;./miuread.koplugin/?/init.lua;;"
        run: |
          set -euo pipefail
          bash tools/run_beta_release_lua_suite.sh
      - name: Offline E-Ink and translation fixtures
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/miuread-eink-check"
          "$RUNNER_TEMP/miuread-eink-check/bin/python" -m pip install lupa==2.8 cryptography==50.0.2
          "$RUNNER_TEMP/miuread-eink-check/bin/python" tools/test_offline_readtime.py
          "$RUNNER_TEMP/miuread-eink-check/bin/python" tools/test_eink_download.py --zlib libz.so.1
          if [ "$RELEASE_CHANNEL" = beta ]; then
            "$RUNNER_TEMP/miuread-eink-check/bin/python" -m unittest discover -s tools -p 'test_*.py'
          else
            "$RUNNER_TEMP/miuread-eink-check/bin/python" -m unittest discover -s tools -p 'test_translation*.py'
          fi
